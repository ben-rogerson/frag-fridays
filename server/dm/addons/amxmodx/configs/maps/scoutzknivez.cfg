// scoutzknivez: low gravity + airstrafing is the whole point of the map.
// AMXX execs this after amxx.cfg on this map only; amxx.cfg (Dockerfile
// append) resets both cvars every map start so these don't leak.
sv_gravity 250
sv_airaccelerate 100
// small map, short rounds (amxx.cfg resets this every map start too)
mp_roundtime 1
// scout-only: the map strips + equips scout/knife each spawn and says
// buying 3, which this stack's DLL ignores - dm_only enforces it instead
// (amxx.cfg resets it every map start)
dm_only "scout"
