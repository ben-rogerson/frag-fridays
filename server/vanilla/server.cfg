// Classic - the 5v5 match mode. Competition rules of the CPL / CAL / CEVO /
// ESL era, one comment per cvar saying what rule the number is.
//
// Full reasoning, the disagreements between leagues, and a source URL for
// every value: docs/classic-rules.md. Read that before changing a number here.
//
// THIS FILE IS THE RULESET, and it is the only file that sets a gameplay
// cvar for Classic. Two things could beat it and neither does:
//   - the compose command's +cvars run BEFORE this, so this wins over them.
//     They are set to match anyway, so the two never disagree on paper.
//   - AMXX execs configs/amxx.cfg AFTER this, so anything in that file would
//     win. server/vanilla/amxx.cfg therefore sets no gameplay cvar at all -
//     it just runs `exec server.cfg` at the end, which is what re-applies
//     everything below on every map. Keep it that way.
//
// Measured on the box 2026-09-04, and NOT what this repo used to believe:
// server.cfg execs ONCE, at container start - a changelevel does not re-run
// it. amxx.cfg is exec'd by AMXX at EVERY map start. That asymmetry is why a
// box-side amxx.cfg holding casual round values beat this file on every map
// after the first, and why amxx.cfg now ends by exec'ing this one.
// Full order at a map start: amxx.cfg -> (exec server.cfg) -> maps/<map>.cfg.

// Mounted over the base image's copy (compose), which ships hostname "My
// WebXash3D CS Server" - the join banner and the server-browser name. Mod
// images bake the same overrides in their Dockerfiles instead.
hostname "Frag Fridays"
sv_lan 0
public 0

// ============================================================================
// THE ROUND
// ============================================================================

// 1 minute 45 seconds a round. The era's round time shortened over the decade
// (3:00 in the MR12 days, 2:30, 2:00) and settled at 1.75 - CPL from Winter
// 2004, CAL from its 2004-08-19 config, ESL by 2009. CEVO is the outlier at
// 2.00. In minutes, hence the decimal.
mp_roundtime 1.75

// 15 seconds frozen at the start of a round, which is the whole of the buy.
// The US leagues (CPL, CAL, CEVO) all ran 15; ESL ran 10 by 2009 and 6 in
// 2004, so there is no single right answer - 15 is the majority and the one
// that pairs with mp_buytime below. If it drags on a Friday, 10 is the
// era-legitimate way to shorten it.
mp_freezetime 15

// 15 seconds to buy - the value is in MINUTES, which is the one unit trap in
// this file. Universal: every league config of the era ships .25.
mp_buytime .25

// 35 seconds from plant to detonation. The single most stable number in
// competitive 1.6 - every league, every year.
mp_c4timer 35

// $800 to start. The pistol round is a pistol round. Universal.
mp_startmoney 800

// ============================================================================
// THE MATCH: MR15
// ============================================================================

// 15 rounds a half, then the map ends. Both teams play both sides, first to
// 16 rounds takes the match.
//
// CAL, ESL and CEVO shipped mp_maxrounds 0 or left it out, and expected an
// admin and HLTV to stop the half by hand. CPL and The Gathering ship 15, and
// that is what we want: nobody here is counting. See docs/classic-rules.md
// for the half-time swap, which CS 1.6 cannot do by itself.
mp_maxrounds 15

// Off. mp_maxrounds is what ends the half; a win limit as well would end one
// early and lose the side the teams had not played yet.
mp_winlimit 0

// NO MAP CLOCK. Every other mode here rotates on a timer - a match does not
// get cut in half by one. The map changes when the half is over, and only
// then. (CEVO wrote this as 999, same effect.)
mp_timelimit 0

// ============================================================================
// THE TEAMS
// ============================================================================

// On, and it is most of what makes 5v5 play differently from a casual round.
// Every league config of the era: 1.
mp_friendlyfire 1

// Off. The server never moves a player between teams. A team is a team.
mp_autoteambalance 0

// 6, which at these team sizes means no limit at all - CAL, CEVO and The
// Gathering all shipped 6, ESL shipped 0, and the two are the same thing on a
// 12-slot server. 5v4 has to be legal while somebody reconnects, and a server
// "fixing" it mid-round would be worse than the problem. The team SIZE is
// capped by the slot count instead (+maxplayers 12 in the compose).
mp_limitteams 6

// Off. A teamkill is a matter for the people in the room, not an automatic
// slay the round after.
mp_tkpunish 0

// Off - killing hostages does not auto-kick. Universal across CAL, CEVO and
// The Gathering; hostage abuse was an admin's problem, not the server's.
// No cs_ map is in Classic's pool, but cvars persist across a map change.
mp_hostagepenalty 0

// Off, and here for two reasons. The leagues ran 0, AND this stack must never
// auto-kick: a backgrounded browser tab sends no input and would trip the
// idle detector on a player who is simply alt-tabbed.
mp_autokick 0

// Vote-kick needs 100% of players, i.e. it is off. ESL is the only league
// sourced that bothered to set this.
mp_kickpercent 1

// ============================================================================
// NO GHOSTING
// ============================================================================

// A dead player's screen goes BLACK until the round ends. This is the era's
// answer to ghosting - you cannot pass on what you cannot see - and it is the
// rule most likely to read as "the game is broken" to someone who has only
// played the casual modes here. It is deliberate, and it is the LAN circuit's
// answer: CPL, ESL, WCG and The Gathering all ran 1, while CAL and CEVO ran 0
// and let dead players watch. Set 0 if it is more confusing than it is worth.
mp_fadetoblack 1

// If a spectator sees anything at all, it is their own team, first person.
// CAL, CEVO, ESL and WCG all ran 2 (CPL and The Gathering wrote 3).
mp_forcecamera 2
mp_forcechasecam 2

// The two spare slots are for spectators and subs. ESL and WCG ran 1; CAL and
// CEVO barred spectators outright (HLTV was the exception, and there is no
// HLTV on this stack).
allow_spectators 1

// ============================================================================
// THE WORLD
// ============================================================================
// The leagues pinned the stock values explicitly rather than trusting a
// server to be unmodified, and so does Classic - this box runs six other mods
// and GoldSrc never resets a cvar at a map change.

sv_maxspeed 320
sv_gravity 800
sv_airaccelerate 10
sv_accelerate 5
sv_friction 4
sv_stopspeed 75
sv_stepsize 18
edgefriction 2

// Lag compensation on, rewinding at most half a second. CAL and WCG both
// shipped this pair; it matters more here than it did on a LAN.
sv_unlag 1
sv_maxunlag 0.5

// No aim assist, no cheats, and clients must match the server's models and
// sounds. mp_autocrosshair (0 in every league config) is NOT a cvar in this
// reimplemented game DLL - verified on the box 2026-09-04, `cvarlist mp_auto`
// returns only autokick/autokick_timeout/autoteambalance - so it is left out
// rather than warning on every map start.
sv_aim 0
sv_cheats 0
mp_consistency 1

// Flashlight and footsteps on - both league-standard, and footsteps in
// particular are half the game at this level.
mp_flashlight 1
mp_footsteps 1

// 0, as CAL and CEVO shipped it. WCG ran 1. One of the several cvars where
// the leagues simply disagreed rather than one being right.
mp_playerid 0

// Decal housekeeping, ESL/CEVO values. Sprays stay ON - this server has a
// spray feature and the era's reason for killing them (bandwidth) is gone.
// mp_decals (300 at ESL) is not a cvar in this DLL either; decalfrequency is
// an engine cvar and does exist.
decalfrequency 60
sv_allowupload 1
sv_allowdownload 1
sv_send_logos 1

// The mic is blocked client-side on this stack anyway, and ESL ran voice off
// in matches for the same reason anyone would: nobody wants the other team in
// their ear.
sv_voiceenable 0
sv_alltalk 0

// sv_proxies (1 at ESL, 2 at CEVO) is the HLTV proxy allowance and is not a
// cvar in this engine - there is no HLTV on this stack anyway, which is
// WebRTC only with no A2S or rcon UDP netchannel at all.

// Nobody can pause a Frag Fridays match. CAL, WCG and CPL (from Winter 2004)
// ran 0 and handled pauses admin-side; ESL, CEVO and The Gathering ran 1 so a
// team could stop for a technical fault. There is no console in the browser
// client to type it into either way.
pausable 0

// ============================================================================
// THIS STACK, NOT THE RULESET
// ============================================================================
// Deliberate deviations. Each one is here because a 2004 LAN final and a
// browser tab in Sydney are not the same problem.

// Browsers freeze the WASM game loop in background tabs, so alt-tabbed
// players go network-silent and the engine default (65s, which is exactly
// what ESL shipped) kicked them. 600s = 10 minutes of grace.
sv_timeout 600

// Rate ceilings for what the shipped userconfig.cfg asks for. The era's
// numbers (sv_maxrate 20000-25000, sv_maxupdaterate 100-101) were sized for
// 2004 domestic broadband; copying them would cap this server BELOW what its
// players already get, for period accuracy nobody can feel. sv_ cvars are
// server-side only, which is why they never worked from the client config.
// No sv_maxcmdrate/sv_mincmdrate - not cvars in this engine.
//
// sv_maxupdaterate 60, not 102 - measured 2026-09-04, see docs/netcode.md.
// The browser client's frame loop is rAF-driven and can never present more
// than one snapshot per display refresh, so 102 just built snapshots for the
// client to throw away. Capping server-side clamps whatever a client asks
// for, so it reaches everyone with no valve.zip rebuild. Measured with 6
// clients on fy_iceworld: ping p95 73-104ms -> 47-48ms, engine CPU 45.6% ->
// 40.0% of a core. The median barely moved - the tail is the whole win.
sv_maxrate 100000
sv_minrate 25000
sv_maxupdaterate 60
sv_minupdaterate 30

// ============================================================================
// THE LOOP
// ============================================================================
// sys_ticrate 200, not the stock 100 - measured 2026-09-04, docs/netcode.md.
// sys_ticrate is what governs the dedicated loop on this engine; fps_max does
// NOT (30 and 500 both moved the measured cadence by zero), so the fps_max 72
// the server reports is a red herring. At 100 the loop does not track its own
// target. 200 took the ping column from p50 44ms / p95 53ms to p50 39ms /
// p95 50ms with six clients, back-to-back - and it costs LESS CPU, 32-37% of
// a core against 39-45%, which was the surprise of the whole exercise.
sys_ticrate 200

// ============================================================================
// LOGGING
// ============================================================================
// ESL's logging set, and the same lines the Friday recap and season standings
// are parsed out of. Goes to cstrike/logs (compose-mounts /opt/cs16/logs/vanilla).
log on
mp_logfile 1
mp_logmessages 1
mp_logdetail 3
mp_logecho 0
