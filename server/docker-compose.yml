services:
  vanilla:
    image: yohimik/cs-web-server-metpamx:latest
    platform: linux/386
    profiles: ["vanilla"]
    command: [ "+map de_dust2", "+maxplayers 14", "+mp_friendlyfire 0" ]
    restart: unless-stopped
    environment:
      PORT: 27018
      IP: ${PUBLIC_IP}
    volumes:
      - "./valve.zip:/xashds/public/valve.zip"
      # custom web client (Frag Friday loading screen) over the image's stock
      # client; index.html is a file mount, so containers restart to pick up
      # a redeploy (same inode rule as valve.zip)
      - "./web/index.html:/xashds/public/index.html:ro"
      - "./web/assets:/xashds/public/assets:ro"
      # mode blurb shown on the loading screen
      - "./info-vanilla.json:/xashds/public/info.json:ro"
      - "./cs/cstrike/maps:/xashds/cstrike/custom/maps:ro"
      - "./mods/zp/plugins:/xashds/cstrike/addons/amxmodx/plugins"
      - "./mods/zp/configs:/xashds/cstrike/addons/amxmodx/configs"
    ports:
      - "27016:27016"
      - "27018:27018/udp"

  gg:
    image: yohimik/cs-web-server-metpamx:latest
