services:
  xash3d:
    build: .
    restart: unless-stopped
    platform: linux/386
    # boot map (image default is de_dust2); keep in sync with mapcycle.txt line 1
    command: ["+map fy_pool_day", "+maxplayers 16"]
    environment:
      PORT: 27038
      IP: 149.28.172.74
    volumes:
      - "../valve.zip:/xashds/public/valve.zip"
      - "../cs/cstrike/maps:/xashds/cstrike/custom/maps:ro"
      # command pipe (remote console) - written by scripts/rc.sh, read by cmdpipe.amxx
      - "../cmdpipe:/xashds/cstrike/cmdpipe:ro"
    ports:
      - "27016:27016"
      - "27038:27038"
      - "27038:27038/udp"
