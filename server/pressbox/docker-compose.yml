# The pressbox spectator - always-optional, its own compose project.
# Sibling to mcp/: never touched by mod-swap logic, cannot trip the
# single-container-on-27016 check (it publishes 27060 only).
#
# The pressbox joins the game like any player and CONSUMES ONE SLOT of the
# running mod's maxplayers. Bring it up when you want to watch remotely,
# bring it down before session start if you want that slot back.
services:
  pressbox:
    build: .
    restart: unless-stopped
    ports:
      - "27060:27060" # http viewer (index page + /latest.png + /health)
    environment:
      # the game container's published port, reached via the host gateway
      # (same trick mcp/ uses to talk to the game from a sibling compose)
      GAME_URL: http://host.docker.internal:27016
      # tune the screenshot cadence without a rebuild
      SHOT_INTERVAL_MS: "5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # screenshots persist across container restarts; the future web portal
      # (apps/web) can also serve from this path
      - "/opt/cs16/pressbox-out:/out"
