// ---------------------------------------------------------------------------
// Shared client config - applied to every player via valve.zip.
// Unknown cvars are ignored by the engine with a console warning, so entries
// that don't exist in this WASM build are harmless.
// ---------------------------------------------------------------------------

// --- GunGame essentials ---
// Weapon changes every kill, so autoswitch and fastswitch matter here.
_cl_autowepswitch 1
hud_fastswitch 1

// --- Performance ---
// Everything runs through WebAssembly on whatever laptop the player has.
// These are cheap wins. cl_minmodels also makes teams easier to tell apart.
cl_shadows 0
r_dynamic 0
r_decals 0
mp_decals 0
max_shells 0
max_smokepuffs 0
cl_minmodels 1

// --- Mouse ---
// Raw input with no filtering or acceleration - consistent aim in the browser.
// sensitivity is a shared default; players can override in-game per session.
m_rawinput 1
m_filter 0
m_customaccel 0
sensitivity 2.0
m_pitch 0.022
m_yaw 0.022
zoom_sensitivity_ratio 1.0

// --- Crosshair ---
// cs16-client's code-drawn crosshair (xhair_*), not the stock sprite one.
// xhair_dynamic_scale 0 zeroes the fire/movement gap kick entirely - the
// stock crosshair always expands on firing even with cl_dynamiccrosshair 0.
// xhair_gap -2 pulls the base gap (4) in; -4 would collapse it to a plus.
xhair_enable 1
xhair_size 2
xhair_thick 0
xhair_gap -2
xhair_dot 0
xhair_dynamic_scale 0
xhair_color "50 250 50 255"
// fallbacks if xhair is unavailable
cl_dynamiccrosshair 0
cl_crosshair_size small
cl_crosshair_translucent 0
cl_crosshair_color "50 250 50"

// --- Networking / prediction ---
// cl_timeout: the client's own drop timer. Browsers freeze the WASM loop in
// background tabs; on tab return the engine sees a huge packet gap and the
// 60s default self-disconnects even when the server (sv_timeout 600) kept
// the slot. Match the server so both sides survive a 10-minute tab-away.
cl_timeout 600
cl_lw 1
cl_lc 1
rate 100000
// cl_updaterate 60, not 102 (measured 2026-09-04, docs/netcode.md). The
// engine's frame loop is rAF-driven here, so it can never present more than
// one snapshot per display refresh - asking for 102 only made the server
// build snapshots this client throws away, and the cost showed up as a long
// ping tail for everyone on the server. This line is the tidy half of the
// fix: the half that actually reaches players is sv_maxupdaterate 60 on the
// server, which clamps whatever a client asks for. Keep the two in step.
cl_updaterate 60
// cl_cmdrate is INERT on this stack, at any value - do not spend time tuning
// it (asked 2026-09-05, measured, docs/netcode.md). Two reasons stacked: the
// engine clamps cl_cmdrate to 100 client-side, so 105 and the "competitive"
// 101 are the same number once the engine has them; and the client builds one
// usercmd per RENDERED frame, so the real limit is the browser's frame rate.
// Measured across six harness runs, outbound packets per second divided by
// rendered frames per second was 0.973-0.984 - one command per frame, every
// time. Any value at or above the frame rate behaves identically. Left at 105
// because changing it would change nothing.
cl_cmdrate 105
// ex_interp 0.1 IS LOAD-BEARING. Do not lower it, and do not follow the CS 1.6
// rates guides that tell you to set ex_interp 0 - on this build that advice
// costs a median 16 units of aim error and puts HALF of all shots at a moving
// target outside a 32-unit-wide hitbox (measured 2026-09-05, docs/netcode.md).
//
// Why: the server rewinds the world for sv_unlag by the amount the CLIENT
// reports in each usercmd's lerp_msec field. The deployed wasm predates
// upstream fix 1bd8513fc and always reports 100ms whatever ex_interp is, so
// registration is correct only while ex_interp is exactly 0.1 - where the
// wrong number happens to be the right one. Lower it and the client draws the
// world at now - ex_interp while still claiming 100ms, and the server rewinds
// too far by the difference.
//
// This is the engine default, so the line is belt-and-braces rather than a
// change: it pins the value where a future default cannot move it, and it puts
// the warning where someone tuning rates will actually read it. Revisit if the
// client is ever bumped past that upstream fix - after it, lower is safe.
ex_interp 0.1
// cl_showfps 0, not 1: the net_graph shipped below prints its own fps, and
// with both on you get TWO fps numbers on screen at once, from different
// sampling windows, disagreeing with each other (verified in-game 2026-09-04
// - "30 fps" in the corner against "33.3 fps" in the block). That reads as a
// bug. net_graph owns the readout now; turning the stats off on the settings
// page turns off the fps with them, which is what "off" should mean.
cl_showfps 0
cl_dlmax 1024
fps_max 99.5

// --- Display ---
// Brighter picture for dark maps on laptop screens.
brightness 1
gamma 3

// --- Quality of life ---
hud_centerid 1
cl_righthand 1
scr_conspeed 9999
cl_bob 0.005

// --- Text/HUD size ---
// These are FWGS extensions (verified present in this build's engine wasm).
// Players can tweak live in console, but changes only apply on the next
// reconnect/map change (HUD fonts build at connect), and NOT after a page
// reload (a reload re-applies these shipped values first).
// Kept at 1 as the shipped default. The scoreboard reason is gone - TAB is
// unbound at boot and the page draws its own board in CSS (see TabScreen.tsx),
// so the vgui-less scoreboard's fixed row spacing can no longer be overlapped
// by a scaled font. What is left is that non-integer scales blur (the fonts
// are GL-stretched bitmaps), so 1 stays the default and the settings panel
// offers the bigger sizes with that cost spelled out.
hud_scale 1
hud_fontscale 1
con_fontscale 1

// --- Join binds ---
// The team select menu does not render in the browser build, so these skip it.
bind "f1" "jointeam 1; joinclass 1"
bind "f2" "jointeam 2; joinclass 1"
// F3 = spectator team (rejoin with F1/F2 if hit by accident).
bind "f3" "jointeam 6"

// --- Radio menu (Z / X / C) ---
// Both of these are needed or Z/X/C do nothing at all.
//
// The server picks how it sends a menu off the client's _vgui_menus userinfo
// key. Shipped config.cfg sets it to 1, so radio1/2/3 come back as a VGUIMenu
// message - and cs16-client's ShowVGUIMenu has no case for MENU_RADIOA/B/C
// (only team/class/buy reach the real menu), so it falls through to
// `exec touch/radioa.cfg`. Those touch configs are a mobile-only feature: no
// touch/ dir exists in the game tree, so nothing ships in valve.zip, and the
// engine's `exec` is a no-op in this wasm build anyway. The menu dies twice.
//
// _vgui_menus 0 routes radio down the ShowMenu path instead - the same
// numbered text menu the AMXX map vote uses, verified in-browser 2026-08-02.
// But CHudMenu::MsgFunc_ShowMenu special-cases any menu string starting
// "#Radio" and hands it straight back to the touch configs when
// _extended_menus is on, so that has to go off too. _extended_menus changes
// nothing else: for every non-radio menu both branches do the same thing.
//
// Menu text comes from stock cstrike/titles.txt (RadioA/RadioB/RadioC), which
// is already in valve.zip.
setinfo "_vgui_menus" "0"
_extended_menus 0

// --- Mouse wheel ---
// Stock invnext/invprev on the wheel causes accidental weapon switches
// (browser scroll momentum); number keys + fastswitch cover selection.
unbind "mwheelup"
unbind "mwheeldown"

// --- Sound ---
// The engine ships volume 0.8, which is a shout out of a laptop in an office
// on the first Friday someone joins without checking their system volume.
// 0.2 is audible enough to hear steps and the buy menu at a desk. Players who
// want it louder move the slider on the page (Your Settings) and their value
// is saved per browser; this only sets what an unchanged client gets.
volume 0.2

// --- Voice ---
// Voice is off server-side and the web client blocks mic capture entirely
// (players were broadcasting without realising). Belt-and-braces client off.
voice_enable 0

// --- On-screen network stats ---
// Was commented out as "noise for a casual game"; now shipped on after the
// 2026-09-04 lag session (docs/netcode.md). The reason it earns its place: a
// player who can read their own ping turns "it feels laggy" into "I'm on
// 180", which is the difference between a report we can act on and one we
// cannot. Players who disagree can turn it off on the settings page.
//
// The values are NOT the GoldSrc ones - measured in-game on this build,
// 2026-09-04, because they are inverted from what the name suggests:
//   1 = three lines of text PLUS a scrolling bar strip
//   2 = a large filled area graph on top of all of that - very busy
//   3 = four lines of text only, and the only one that prints loss/choke
// So 3 is both the most informative and the LEAST cluttered. net_graphpos 2
// centres it along the bottom edge, clear of the ammo and health numbers
// (pos 1, the default, drops it on top of the ammo counter).
//
// This owns the fps readout now - see the cl_showfps 0 note above.
net_graph 3
net_graphpos 2

echo "userconfig.cfg loaded - press F1 to join T, F2 to join CT (F3 = spectate)"
