services:
  vanilla:
    image: yohimik/cs-web-server-metpamx:0.1.3
    platform: linux/386
    profiles: ["vanilla"]
    # Classic is the 5v5 match mode, so the slot count is the format: 10 for
    # the two teams plus 2 spare (a sub, or someone watching from spectate).
    # Any more and "5v5" would only be a suggestion - there is no cvar that
    # caps a team at five, only maxplayers and mp_limitteams between them.
    #
    # These +cvars only cover the first moments of a cold boot: server.cfg
    # execs after them and beats them, and it is where the ruleset lives.
    # They are set to match it anyway, so the two never disagree on paper.
    # +sv_timeout: browsers freeze the WASM game loop in background tabs, so
    # alt-tabbed players go network-silent; the engine default (65s) kicked
    # them. Mod images bake this into server.cfg instead (their Dockerfiles).
    command: ["+map de_dust2", "+maxplayers 12", "+mp_friendlyfire 1", "+sv_timeout 600"]
    restart: unless-stopped
    environment:
      PORT: 27018
      IP: ${PUBLIC_IP}
    volumes:
      - "./valve.zip:/xashds/public/valve.zip"
      # custom web client (Frag Fridays loading screen) over the image's stock
      # client; index.html is a file mount, so containers restart to pick up
      # a redeploy (same inode rule as valve.zip)
      - "./web/index.html:/xashds/public/index.html:ro"
      - "./web/assets:/xashds/public/assets:ro"
      # mode blurb shown on the loading screen
      - "./info-vanilla.json:/xashds/public/info.json:ro"
      # statusjson.amxx writes this (mod images pre-create it at build; vanilla
      # can't, so it's a writable file mount - truncate-in-place keeps the inode)
      - "./status-vanilla.json:/xashds/public/status.json"
      # classic rotation over the stock 2-map cycle (all-stock maps already in
      # the valve.zip keep-list); keep line 1 equal to the +map boot arg
      - "./vanilla/mapcycle.txt:/xashds/cstrike/mapcycle.txt:ro"
      # hostname "Frag Fridays" over the base default ("My WebXash3D CS
      # Server" - the join banner); mod images bake this in their Dockerfiles
      - "./vanilla/server.cfg:/xashds/cstrike/server.cfg:ro"
      - "./cs/cstrike/maps:/xashds/cstrike/custom/maps:ro"
      - "./mods/zp/plugins:/xashds/cstrike/addons/amxmodx/plugins"
      - "./mods/zp/configs:/xashds/cstrike/addons/amxmodx/configs"
      # ...and the repo takes ONE file back off that box-side configs dir.
      # AMXX execs configs/amxx.cfg at EVERY map start; server.cfg execs only
      # at container start (measured 2026-09-04). So whatever is in amxx.cfg
      # beats server.cfg on every map after the first - which is exactly what
      # the box copy was doing with Classic's old casual values (16k money,
      # 2.5 min rounds, 10 min maps), invisibly outranking the config in this
      # repo. The repo copy sets no gameplay cvar at all and ends with
      # `exec server.cfg`, so the ruleset re-applies every map from one file.
      # Docker applies bind mounts deepest-path-last, so this file wins over
      # the directory mount above (verified on the box: yb_quota_mode reads
      # `fill` where the box file says `normal`).
      - "./vanilla/amxx.cfg:/xashds/cstrike/addons/amxmodx/configs/amxx.cfg:ro"
      # ...and configs/maps.ini, mapchooser's list of maps the end-of-map vote
      # may offer. The mod Dockerfiles regenerate it from mapcycle.txt so a
      # vote can never send players to a map that is not in valve.zip; vanilla
      # has no build step, so its box copy had gone stale and was still
      # offering de_prodigy and cs_militia, neither of which is in the client
      # payload at all (found 2026-09-04). Keep it equal to mapcycle.txt.
      - "./vanilla/maps.ini:/xashds/cstrike/addons/amxmodx/configs/maps.ini:ro"
      # command pipe (remote console) - written by scripts/rc.sh, read by cmdpipe.amxx
      - "./cmdpipe:/xashds/cstrike/cmdpipe:ro"
      # YaPB bots (mod images bake these in; vanilla mounts them). The tree is
      # seeded BOX-SIDE like the rest of mods/: /opt/cs16/mods/yapb is a copy
      # of gg/addons/yapb, chown 1000; mods/metamod-plugins.ini = the image's
      # stock Metamod plugins.ini (amxmodx line) + the yapb registration line.
      # yapb dir stays writable - YaPB downloads graphs into data/ at map start.
      - "./mods/yapb:/xashds/cstrike/addons/yapb"
      # ...and the repo owns the one setting that decides whether Classic is a
      # match: yb_quota 0, so a cold start has zero bots and all 10 playing
      # seats stay open for people. Bots are still fully supported (war room
      # Bots panel, or `pnpm run rc "yb_quota 4"`); YaPB re-reads this file on
      # load, so every restart lands back on zero. Same deepest-path-last rule
      # as amxx.cfg above.
      - "./vanilla/yapb.cfg:/xashds/cstrike/addons/yapb/conf/yapb.cfg:ro"
      - "./mods/metamod-plugins.ini:/xashds/cstrike/addons/metamod/plugins.ini:ro"
      # HL kill logs (log on + mp_logfile in vanilla/server.cfg) - persisted
      # for the recap; mod images do the same via their Dockerfiles
      - "./logs/vanilla:/xashds/cstrike/logs"
      # segfault forensics: host kernel.core_pattern=/cores/core.%e.%t writes
      # dumps here (2026-08-14 session: two engine crashes, no evidence left)
      - "./cores:/cores"
    ulimits:
      core:
        soft: -1
        hard: -1
    ports:
      - "27016:27016"
      - "27018:27018/udp"

  gg:
    image: yohimik/cs-web-server-metpamx:0.1.3
    platform: linux/386
    profiles: ["gg"]
    command: ["+map de_dust2", "+maxplayers 14", "+mp_friendlyfire 0"]
    restart: unless-stopped
    environment:
      PORT: 27028
      IP: ${PUBLIC_IP}
    volumes:
      - "./valve.zip:/xashds/public/valve.zip"
      # custom web client (Frag Fridays loading screen) over the image's stock
      # client; index.html is a file mount, so containers restart to pick up
      # a redeploy (same inode rule as valve.zip)
      - "./web/index.html:/xashds/public/index.html:ro"
      - "./web/assets:/xashds/public/assets:ro"
      - "./cs/cstrike/maps:/xashds/cstrike/custom/maps:ro"
      - "./mods/gg/plugins:/xashds/cstrike/addons/amxmodx/plugins"
      - "./mods/gg/configs:/xashds/cstrike/addons/amxmodx/configs"
    ports:
      - "27016:27016"
      - "27028:27028/udp"

  dm:
    image: yohimik/cs-web-server-metpamx:0.1.3
    platform: linux/386
    profiles: ["dm"]
    command: ["+map de_dust2", "+maxplayers 14", "+mp_friendlyfire 0"]
    restart: unless-stopped
    environment:
      PORT: 27038
      IP: ${PUBLIC_IP}
    volumes:
      - "./valve.zip:/xashds/public/valve.zip"
      # custom web client (Frag Fridays loading screen) over the image's stock
      # client; index.html is a file mount, so containers restart to pick up
      # a redeploy (same inode rule as valve.zip)
      - "./web/index.html:/xashds/public/index.html:ro"
      - "./web/assets:/xashds/public/assets:ro"
      - "./cs/cstrike/maps:/xashds/cstrike/custom/maps:ro"
      - "./mods/dm/plugins:/xashds/cstrike/addons/amxmodx/plugins"
      - "./mods/dm/configs:/xashds/cstrike/addons/amxmodx/configs"
    ports:
      - "27016:27016"
      - "27038:27038/udp"
