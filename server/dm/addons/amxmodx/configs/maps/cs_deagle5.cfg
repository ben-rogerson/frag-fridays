// cs_deagle5: the map runs its own loadout - a game_player_equip strips
// everyone on spawn and hands out deagle + armour, and info_map_parameters
// says buying 3 (nobody can buy). This stack's DLL ignores the buying rule,
// so frag_dm enforces it: deagle replaces the DM kit and anything else is
// stripped on deploy. amxx.cfg resets dm_only every map start so this does
// not leak to other maps.
dm_only "deagle"
