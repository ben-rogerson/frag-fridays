// css_bycastor: the BSP ships its own floor guns (32 AWP + 3 HE armoury
// entities) and has no bombsite, so dm_map_guns skips the DM rifle handout -
// players spawn with the deagle and grab AWPs off the floor. Armoury entities
// only restock on round restart, which never happens under DM on a
// no-objective map, so the map's guns circulate through kill/drop/pickup.
// amxx.cfg resets this every map start.
dm_map_guns 1
mp_roundtime 1
