// css_deagle: the map runs its own loadout - a game_player_equip hands out
// deagle + knife on spawn. Same story as cs_deagle5 in dm: this stack's DLL
// ignores the map's buying rule, so frag_dm enforces it instead - deagle
// replaces the DM kit and anything else is stripped on deploy. amxx.cfg
// resets dm_only every map start so this does not leak to other maps.
dm_only "deagle"
// tiny arena map, 5-minute rounds drag
mp_roundtime 1
