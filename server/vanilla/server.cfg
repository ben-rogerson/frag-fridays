// Vanilla server.cfg - mounted over the base image's copy (compose), which
// ships hostname "My WebXash3D CS Server"; that string is the join banner
// ("Welcome to ...") and the scoreboard/server-browser name. Mod images bake
// the same overrides in their Dockerfiles instead.
hostname "Frag Fridays"
sv_lan 0
public 0
// server.cfg execs at map start, AFTER the compose command's +cvars - keep
// these here too or the base values would win over the boot args.
mp_friendlyfire 0
mp_timelimit 30
mp_autoteambalance 1
// browsers freeze the WASM game loop in background tabs, so alt-tabbed
// players go network-silent; don't kick them (same reasoning as mod images)
sv_timeout 600
mp_autokick 0
// rate ceilings for the client rates userconfig.cfg asks for; sv_ cvars are
// server-side only, so they never worked from the client config. No
// sv_maxcmdrate/sv_mincmdrate - not cvars in this engine.
//
// sv_maxupdaterate 60, not 102 - measured 2026-09-04, see docs/netcode.md.
// The browser client's frame loop is rAF-driven and can never present more
// than one snapshot per display refresh, so 102 just built snapshots for the
// client to throw away. Capping server-side clamps whatever a client asks
// for, so it reaches everyone with no valve.zip rebuild. Measured with 6
// clients on fy_iceworld: ping p95 73-104ms -> 47-48ms, engine CPU 45.6% ->
// 40.0% of a core. The median barely moved - the tail is the whole win.
sv_maxrate 100000
sv_minrate 25000
sv_maxupdaterate 60
sv_minupdaterate 30
// HL kill logging into cstrike/logs (compose-mounts /opt/cs16/logs/vanilla) -
// feeds the Friday recap + standings; mod images bake this in their Dockerfiles
log on
mp_logfile 1
