// Classic (vanilla) AMX Mod X config. Mounted by the root compose over
// /opt/cs16/mods/zp/configs/amxx.cfg, the box-side copy nothing in server/
// synced - so from here the file is under version control like everything
// else.
//
// WHY THIS FILE EXISTS AT ALL, and why it sets no gameplay cvar:
//
// AMXX execs configs/amxx.cfg at EVERY map start, and it does so AFTER the
// engine has exec'd server.cfg. So anything set here beats server.cfg, and
// the box copy used that to hold Classic's old casual quick-round values -
// mp_startmoney 16000, mp_roundtime 2.5, mp_freezetime 5, mp_c4timer 35,
// mp_timelimit 10. Those silently outranked server.cfg, which is exactly why
// the ruleset appeared not to take.
//
// The fix is not to move the ruleset in here. It is to stop this file having
// an opinion: with no mp_ cvars set at this stage, server.cfg is unopposed
// and IS the single readable source of truth for how Classic plays. Keep it
// that way - a cvar added below is a cvar that will quietly beat server.cfg
// six months from now and nobody will find it.
// Exec order, verified 2026-08-02: server.cfg -> amxx.cfg -> maps/<map>.cfg.

echo Executing Frag Fridays Classic AMX Mod X configuration

// --- AMX Mod X housekeeping -------------------------------------------------
// Only the settings that differ from AMXX's own compiled-in defaults, plus the
// couple worth stating out loud. The stock file's scrolling-advert lines
// (amx_scrollmsg / amx_imessage "This server is using AMX Mod X") are simply
// absent - the mod images strip them with sed at build time and Classic has
// no build step to do it in.

// admin auth: players set `setinfo _pw "<password>"` then `name admin`, in
// that order (AMXX re-auths on the name change and wants _pw already set).
// Stated explicitly because it is the one AMXX default the docs depend on.
amx_password_field "_pw"
amx_mode 1

// show admin actions to everyone, with the admin's name. On a ten-person
// match server there is no reason for an admin action to be anonymous.
amx_show_activity 2

// --- per-map cvar baseline --------------------------------------------------
// GoldSrc never resets a cvar at a map change, so anything a per-map config
// (configs/maps/<map>.cfg) sets follows the server into every map after it.
// These are the stock values, re-asserted every map start so a per-map
// override is a per-map override. See decisions.md, 2026-08-02.
sv_gravity 800
sv_airaccelerate 10

// restmenu.amxx's weapon restrictions are the same hazard: `amx_restrict on`
// in a per-map config would otherwise persist. Classic's pool has no
// restricted maps today, but the reset costs nothing and the pool changes.
amx_restrict off
