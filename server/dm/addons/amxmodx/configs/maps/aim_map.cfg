// aim_map: small map, short rounds. amxx.cfg resets mp_roundtime
// every map start so this does not leak.
mp_roundtime 1

// The BSP ships its own floor guns (16 AK-47, 16 M4A1, 8 AWP armoury
// entities) - dm_map_guns skips the DM rifle handout, so players spawn with
// the deagle and grab rifles off the floor. Dropped primaries are exempt
// from weaponbox cleanup on this map: armoury entities only restock on round
// restart, which never happens under DM, so the map's guns circulate through
// kill/drop/pickup instead. amxx.cfg resets this every map start too.
dm_map_guns 1
