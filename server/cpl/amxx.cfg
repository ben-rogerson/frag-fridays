// CPL Tournament (cpl) AMX Mod X config. Mounted by the root compose over
// /opt/cs16/mods/zp/configs/amxx.cfg - the box-side copy that nothing in
// server/ syncs - so from here it is under version control like everything
// else. Everything below is that box copy VERBATIM as of 2026-09-04 except
// for the gameplay block at the very bottom; diff it against the box before
// trusting a change either way.
//
// WHY THIS FILE EXISTS, and why it must set no gameplay cvar:
//
// AMXX execs configs/amxx.cfg at EVERY map start, and it does so AFTER the
// engine has exec'd server.cfg. So anything set here beats server.cfg, and
// the box copy used that to hold this mode's old casual quick-round values.
// Those silently outranked server/cpl/server.cfg - which is why the file
// in this repo that looks like the server's config was not the one deciding
// how CPL Tournament played.
//
// The fix is not to move the ruleset in here. It is to stop this file having
// an opinion: with no mp_ cvar set at this stage, server.cfg is unopposed and
// IS the single readable source of truth for how CPL Tournament plays. Keep it
// way - a cvar added below will quietly beat server.cfg six months from now
// and nobody will find it. The last line of this file re-runs server.cfg
// instead, so the ruleset is re-applied every map from that one place.
// Order at a map start: amxx.cfg -> (exec server.cfg) -> maps/<map>.cfg.
//
// The AMX Mod X settings below are the stock ones, with two deliberate
// exceptions, neither of which a fresh AMXX ships: the scrolling-advert line
// (amx_scrollmsg) has been deleted, and amx_imessage is off - see below.

// AMX Mod X Configuration File
echo Executing AMX Mod X Configuration File

// Default access for all non admin players (see users.ini for access details)
//
// Default value: "z"
amx_default_access "z"

// Name of setinfo which should store a password on a client (you should change this)
// Note: Always prefix the field with an underscore (aka: "_")
// (Example: setinfo _pw "password")
//
// Default value: "_pw"
amx_password_field "_pw"

// Mode of logging to a server
// 0 - disable logging, players won't be checked (and access won't be set)
// 1 - normal mode which obey flags set in accounts
// 2 - kick all players not on list
//
// Default value: 1
amx_mode 1

// Show admins activity
// 0 - disabled
// 1 - show without admin name
// 2 - show with name
// 3 - show name only to admins, hide name from normal users
// 4 - show name only to admins, show nothing to normal users
// 5 - hide name only to admins, show nothing to normal users
//
// Default value: 2
amx_show_activity 2

// Frequency in seconds and text of scrolling message
//
// Default value: "Welcome to %hostname% -- This server is using AMX Mod X" 600

// Center typed colored messages (last parameter is a color in RRRGGGBBB format)
//
// Default values: "Welcome to %hostname%" "000255100"
//                 "This server is using AMX ModX\nVisit http://www.amxmodx.org" "000100255"
// OFF here since 2026-09-04, and off in every other mode since 2026-09-05
// (their Dockerfiles now strip every amx_imessage line, not just AMXX's own
// advert). The box copy carried a hand-written
// "Welcome to %hostname%" here - not AMXX's stock plug, someone had rewritten
// it - and imessage.amxx prints it centre-screen every amx_freq_imessage
// seconds whether or not a round is live. On a 5v5 that is a banner over the
// middle of the screen mid-round, every three minutes. The plugin stays
// loaded; with no message registered it has nothing to print. Uncomment to
// bring it back.
// amx_imessage "Welcome to %hostname%" "000255100"

// Frequency in seconds of colored messages
//
// Default value: 180
amx_freq_imessage 180

// Ban times for the main ban menu (amx_banmenu)
// Use 0 for permanent ban
// Default values: 0 5 10 15 30 45 60
amx_plmenu_bantimes 0 5 10 15 30 45 60

// Max temporary ban time (admins with ADMIN_BAN_TEMP access can't ban more than this time)
// time in minutes, 60 is 1 hour, 120 is 2 hours, 1440 is 1 day, and 10080 is 1 week
// Default value: 4320 aka 3 days
amx_tempban_maxtime 4320

// Slap damage amounts for the main slap menu (amx_slapmenu)
// Slay is automaticall inserted as the last option
// Default values: 0 1 5
amx_plmenu_slapdmg 0 1 5

// Set in seconds how fast players can chat (chat-flood protection)
//
// Default value: 0.75
amx_flood_time 0.75

// Amount of slots to reserve.
//
// Default value: 0
amx_reservation 0

// If you set this to 1, you can hide slots on your server.
// If server "full" of public slots and slots hidden, you must manually connect with connect console command
//
// Default value: 0
amx_hideslots 0

// Displaying of time remaining
// a - display white text on bottom
// b - use voice
// c - don't add "remaining" (only in voice)
// d - don't add "hours/minutes/seconds" (only in voice)
// e - show/speak if current time is less than this set in parameter
//
// Default value: "ab 1200" "ab 600" "ab 300" "ab 180" "ab 60" "bcde 11"
amx_time_display "ab 1200" "ab 600" "ab 300" "ab 180" "ab 60" "bcde 11"

// Announce "say thetime" and "say timeleft" with voice, set to 0 to disable.
//
// Default value: 1
amx_time_voice 1

// Minimum delay in seconds between two voting sessions
//
// Default value: 10
amx_vote_delay 10

// How long voting session goes on
//
// Default value: 10
amx_vote_time 10

// Display who votes for what option, set to 0 to disable, 1 to enable.
//
// Default value: 1
amx_vote_answers 1

// Some ratios for voting success

// Default value: 0.40
amx_votekick_ratio 0.40

// Default value: 0.40
amx_voteban_ratio 0.40

// Default value: 0.40
amx_votemap_ratio 0.40

// Default value: 0.02
amx_vote_ratio 0.02

// Max. time to which map can be extended
//
// Default value: 90
amx_extendmap_max 90

// Step for each extending
//
// Default value: 15
amx_extendmap_step 15

// Server language in ISO 639-1 format
// Please see data/lang/languages.txt file for a list of supported languages
//
// Default value: en
amx_language "en"

// If you set this to 0, clients cannot chose their language, instead they use
// whatever language the server is configured to use.
//
// Default value: 1
amx_client_languages 1

// If you set this to 0, clients will not see a message about amx_langmenu when they join the server
//
// Default value: 1
amx_language_display_msg 1

// If you set this to 0, clients will not see a message about amx_help when they join the server
//
// Default value: 1
amx_help_display_msg 1

// Time to wait (in seconds) before displaying a message about amx_help to a client once joined the server
//
// Default value: 15
amx_help_display_msg_time 15

// Amount of commands per amx_help page
//
// Default value: 10
amx_help_amount_per_page 10

// Plugin Debug mode
// 0 - No debugging (garbage line numbers)
// 1 - Plugins with "debug" option in plugins.ini are put into debug mode
// 2 - All plugins are put in debug mode
// Note - debug mode will affect JIT performance
//
// Default value: 1
amx_debug 1

// Plugin MultiLingual Debug
// To debug a language put its 2 letter code between quotes ("en", "de", etc)
// "" means disabled
//
// Default value: ""
amx_mldebug ""

//
// Beginning of Counter-Strike package specific configurations.
//

// Rank mode
// 0 - by nick
// 1 - by authid 
// 2 - by ip
//
// Default value: 1
csstats_rank 1

// Max size of the stats file
//
// Default value: 3500
csstats_maxsize 3500

// Whether or not to rank bots with csstats - set to 1 to rank bots, 0 otherwise.
//
// Default value: 0
csstats_rankbots 0

// Duration of HUD-statistics
//
// Default value: 12.0
amx_statsx_duration 12.0

// HUD-statistics display limit relative round freeze end
// Negative time will clear the HUD-statstics before the round freeze time has ended
//
// Default value: -2.0
amx_statsx_freeze -2.0

// Sets whether Restrict Weapons plugin should use a configuration file per map or or not.
// If enabled, the file format is: weaprest_mapname.ini (e.g. weaprest_de_dust.ini).
// -
// Default value: 0
amx_restrmapsettings 0


// weapon restrictions are per-map (configs/maps/*.cfg) - reset every map start
amx_restrict off
// baseline for per-map overrides (scoutzknivez) so they cannot leak
sv_gravity 800
sv_airaccelerate 10

// ---------------------------------------------------------------------------
// AND NOTHING ELSE. The five lines that used to sit here - mp_startmoney
// 16000, mp_roundtime 2.5, mp_freezetime 5, mp_c4timer 35, mp_timelimit 10,
// added 2026-08-11 for quick casual rounds - are gone, because this mode is the
// 5v5 match mode now and those values are in server.cfg's gift, not this
// file's. Do not add an mp_ cvar back. See the header.
//
// Instead, re-run server.cfg. Measured on the box 2026-09-04, and it is not
// what this repo believed: server.cfg execs ONCE, at container start, and
// never again - a changelevel does not re-run it. amxx.cfg, by contrast, is
// exec'd by AMXX at EVERY map start. That asymmetry is the whole reason the
// old casual values won: they were re-applied on every map while server.cfg
// never got another turn.
//
// So this line gives the ruleset the same per-map re-assertion the casual
// values used to have, without a second copy of it existing anywhere. It also
// means a cvar someone changes live goes back to the ruleset at the next map
// rather than persisting for the life of the container.
exec server.cfg
// ---------------------------------------------------------------------------
